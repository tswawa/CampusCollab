services:
  campus:
    build: .
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      SCHOOL_TIMEZONE: ${SCHOOL_TIMEZONE:-Asia/Shanghai}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - campus-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  campus-data:
